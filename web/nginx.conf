# nginx serving the PhotoPi static frontend and proxying the API.
# One lightweight nginx process is all the Pi needs for the web tier.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets; images/videos are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Large uploads are not used, but allow big range requests for video.
    client_max_body_size 16m;

    # --- API + media: reverse-proxy to the FastAPI backend ---------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media files (originals/previews) can be large; allow slow Pi IO.
        proxy_read_timeout 300s;
        proxy_buffering off;          # stream files straight through
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Health endpoint passthrough (used by `docker compose` / monitoring).
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # --- Static frontend --------------------------------------------------
    # Hashed Next.js assets are immutable - cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style fallback: unknown paths resolve to their .html or index.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
